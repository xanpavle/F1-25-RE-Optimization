# ============================================================================
#  F1 25 Renderer Tune  (proxy dinput8.dll)
# ============================================================================
#  Place this file next to F1_25.exe (e.g. inside the "F1 25" folder).
#
#  WHAT IT DOES
#    1) [profile]   - at launch, rewrites a tuned set of attributes in the
#                     game's own hardware_settings_config.xml, in place, before
#                     the engine reads it. This is where the real FPS comes from.
#                     Only the attributes in src/profile.cpp are changed.
#    2) [upscaler]  - detects your GPU and picks the upscaler it actually
#                     supports (DLSS / FSR 3 / XeSS / TAA) in the same file.
#    3) [override]  - detours the engine's generic settings accessor and
#                     substitutes values for engine-level flags listed below.
#    No .exe and no game data file is modified.
#
#  ANTI-CHEAT
#    Runtime hook + settings profile. Use OFFLINE / single-player only.
# ============================================================================

[log]
# 0 = quiet (recommended for normal play). 1 = discovery mode: log every
# setting the engine reads to f125_tune.log.
all = 0
# When all = 0, log only names with this prefix (empty = nothing).
prefix =


# ============================================================================
#  PROFILE  (the main FPS lever)
#  apply = 1  -> rewrite the tuned attributes in hardware_settings_config.xml
#                at launch, in place, before the engine reads it.
#  apply = 0  -> leave the game's settings alone.
# ============================================================================
[profile]
apply = 1


# ============================================================================
#  UPSCALER  (GPU-aware)
#  mode = auto  -> detect the GPU and pick the best backend it supports:
#                    NVIDIA RTX 20/30/40/50 -> DLSS
#                    NVIDIA GTX 10/16       -> FSR 3 (no DLSS hardware)
#                    AMD Radeon             -> FSR 3
#                    Intel Arc              -> XeSS
#                    Intel iGPU / unknown   -> FSR 3 (unknown: leave alone)
#  mode = dlss | fsr3 | xess | taa | off | keep
#                Force one backend. "keep" changes nothing.
#  The quality level (aa_quality) is never changed - it stays what you picked
#  in-game (Quality / Balanced / Performance ...).
# ============================================================================
[upscaler]
mode = auto


# ============================================================================
#  ENGINE-LEVEL OVERRIDES
#  <setting name> = <value>   (true/false, integer, or float)
#  These are read from the engine's generic accessors (the mod detours them),
#  so they cover knobs the settings file does not expose.
# ============================================================================
[override]

# Variable Rate Shading - free-ish, keep on.
Renderer.Gfx.enableVRS = 1
# Async compute - overlaps compute on a second queue.
Renderer.Gfx.enableAsyncCompute = 1

# --- ground cover / grass instance caps (engine level, not in the settings file)
Renderer.Gfx.groundCoverForceUltraQuality = 0
Renderer.Gfx.groundCoverMaxInstances = 40000
Renderer.Gfx.groundCover2MaxInstances = 80000
Renderer.Gfx.groundCover2MaxMeshInstances = 4000

# --- static / PVS instance caps (more aggressive world culling) ---------------
# Lower = fewer far instances submitted. If you see distant props popping in,
# raise these back toward 24500 / 24800.
Renderer.maxStaticInstances = 20000
Renderer.maxPVSRenderInstances = 20000
