# ============================================================================
#  F1 25 Renderer Tune  (proxy dinput8.dll)
# ============================================================================
#  Place this file next to F1_25.exe (e.g. inside the "F1 25" folder).
#
#  WHAT IT DOES
#    1) [profile]   - at launch, rewrites a tuned set of attributes in the
#                     game's own hardware_settings_config.xml, in place, before
#                     the engine reads it. This is where the real FPS comes from.
#                     Only the attributes in src/profile.cpp are changed.
#                     v0.2.0 also enforces the tuned shadow / fog / crowd values
#                     inside the running engine (past the preset clamp) and
#                     restores the delta after a graphics-menu preset change.
#                     The enforcement addresses are re-derived by signature at
#                     startup, so the mod survives most game updates.
#    2) [upscaler]  - detects your GPU and picks the upscaler it actually
#                     supports (DLSS / FSR 3 / XeSS / TAA) in the same file.
#    3) [override]  - detours the engine's generic settings accessor and
#                     substitutes values for engine-level flags listed below.
#    No .exe and no game data file is modified.
#
#  ANTI-CHEAT
#    Runtime hook + settings profile. Use OFFLINE / single-player only.
# ============================================================================

[log]
# 0 = quiet (recommended for normal play). 1 = discovery mode: log every
# setting the engine reads to f125_tune.log.
all = 0
# When all = 0, log only names with this prefix (empty = nothing).
prefix =


# ============================================================================
#  PROFILE  (the main FPS lever)
#  apply = 1  -> rewrite the tuned attributes in hardware_settings_config.xml
#                at launch, in place, before the engine reads it.
#  apply = 0  -> leave the game's settings alone.
# ============================================================================
[profile]
apply = 1
# enforce = 1 -> apply the tuned values *inside the running engine* as well.
#   The game clamps many attributes back to whatever the graphics preset
#   allows, so the file delta alone can be reverted. This makes the tuned
#   shadow / fog / crowd / texture-streaming values stick regardless of the
#   preset, pins 17 booleans (rain, grass, god rays, ...) to the tuned
#   profile, and enforces the two float settings (cloud RT scale and grass
#   draw distance). See the log line "enforce: <name> -> ...".
enforce = 1
# guard = 1 -> after you change graphics settings in the menu, the game
#   re-writes hardware_settings_config.xml; this puts the tuned delta back.
guard = 1
# enforce_mode = cheaper -> DEFAULT. Only ever remove work; never raise the
#   numeric shadow/fog settings above the in-game preset. Fastest mode.
#   The boolean effects (rain / grass / fog stay ON, god rays / lens streak /
#   motion blur OFF) are pinned in both modes.
# enforce_mode = target  -> the mod's tuned numeric values win even when the
#   game's preset is lower than them. Use this if the game is stuck on a preset
#   and refuses to honour Ultra High: the mod then defines the quality level,
#   at a small cost.
# enforce_mode = off -> disable all in-engine enforcement (the file delta in
#   [profile] apply = 1 still happens).
enforce_mode = cheaper


# ----------------------------------------------------------------------------
#  GAME UPDATED?  The mod re-derives its hooks at launch. To force the full
#  scan even when the known addresses still look valid, create an empty file
#  named  f125_force_scan.txt  next to F1_25.exe and launch once (about 4 s).
#  The log shows "enforce: force-scan enabled" and every re-derivation.
#  Delete the file afterwards. F125_FORCE_SCAN=1 in the environment also works.
# ----------------------------------------------------------------------------


# ============================================================================
#  ENFORCE  (fine-tuning of the in-engine table)
#  Every value the mod enforces can be overridden per attribute here, or
#  switched off, without rebuilding. Attribute names are the ones printed in
#  f125_tune.log ("enforce: <name> -> <value> ...").
#
#    <name> = <value>    force a specific value (true/false/integer/decimal)
#    <name> = off        leave this attribute exactly as the game's preset set it
#
#  Values with a decimal point are treated as floats (2.0), plain numbers as
#  integers (2048).
#
#  Examples:
#    worldShadowMapSize = 1024          # more aggressive than the default 2048
#    rainSheets = off                   # let the preset decide
#    textureStreamingMiB = 3072         # more VRAM for textures (8-12 GB cards)
#    proceduralCloudRTScale = 1.0       # full-res RT clouds (costs FPS)
#    groundCover.drawDistance = 120.0   # longer grass draw distance
#    groundCover.drawDistance = off     # let the preset decide
#
#  bools = 0 disables the boolean pinning as a group (rain, grass, god rays,
#  ...) while the numeric values keep being enforced.
# ============================================================================
[enforce]
bools = 1


# ============================================================================
#  UPSCALER  (GPU-aware)
#  mode = auto  -> detect the GPU and pick the best backend it supports:
#                    NVIDIA RTX 20/30/40/50 -> DLSS
#                    NVIDIA GTX 10/16       -> FSR 3 (no DLSS hardware)
#                    AMD Radeon             -> FSR 3
#                    Intel Arc              -> XeSS
#                    Intel iGPU / unknown   -> FSR 3 (unknown: leave alone)
#  mode = dlss | fsr3 | xess | taa | off | keep
#                Force one backend. "keep" changes nothing.
#  The quality level (aa_quality) is never changed - it stays what you picked
#  in-game (Quality / Balanced / Performance ...).
# ============================================================================
[upscaler]
mode = auto


# ============================================================================
#  ENGINE-LEVEL OVERRIDES
#  <setting name> = <value>   (true/false, integer, or float)
#  These are read from the engine's generic accessors (the mod detours them),
#  so they cover knobs the settings file does not expose.
# ============================================================================
[override]

# Variable Rate Shading - free-ish, keep on.
Renderer.Gfx.enableVRS = 1
# Async compute - overlaps compute on a second queue.
Renderer.Gfx.enableAsyncCompute = 1

# --- ground cover / grass instance caps (engine level, not in the settings file)
Renderer.Gfx.groundCoverForceUltraQuality = 0
Renderer.Gfx.groundCoverMaxInstances = 40000
Renderer.Gfx.groundCover2MaxInstances = 80000
Renderer.Gfx.groundCover2MaxMeshInstances = 4000

# --- static / PVS instance caps (more aggressive world culling) ---------------
# Lower = fewer far instances submitted. If you see distant props popping in,
# raise these back toward 24500 / 24800.
Renderer.maxStaticInstances = 20000
Renderer.maxPVSRenderInstances = 20000
